<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reto Inocuidad HF — Examen de Inocuidad Alimentaria</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --azul:#2563eb; --azul-osc:#1e40af; --morado:#7c3aed;
  --verde:#16a34a; --rojo:#dc2626; --gris:#64748b;
  --bg:#f1f5f9; --card:#ffffff; --texto:#0f172a;
  --sombra:0 10px 30px rgba(2,6,23,.12);
  --radio:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#ecfeff 60%,#f0fdf4);
  color:var(--texto);min-height:100vh;
}
.app{max-width:760px;margin:0 auto;padding:24px 16px 60px}

/* ---- pantallas ---- */
.pantalla{display:none;animation:fade .4s ease}
.pantalla.activa{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- tarjetas ---- */
.card{
  background:var(--card);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:30px 28px;text-align:center;
}
.logo{width:96px;height:96px;margin:0 auto 8px;display:block}
h1{font-size:1.6rem;line-height:1.2;margin-bottom:4px;color:var(--azul-osc)}
.subtitulo{color:var(--gris);margin-bottom:18px;font-weight:600}
.info-examen{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px;
}
.info-examen span{
  background:#eff6ff;color:var(--azul-osc);border-radius:999px;
  padding:6px 14px;font-size:.82rem;font-weight:600;
}

/* ---- formulario ---- */
form{text-align:left;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:6px;color:#334155}
input{
  padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;
  font-size:1rem;transition:border .2s;
}
input:focus{outline:none;border-color:var(--azul)}
.error{color:var(--rojo);font-size:.85rem;min-height:1em;font-weight:600;text-align:center}

/* ---- botones ---- */
.btn{
  border:none;border-radius:12px;padding:14px 20px;font-size:1rem;
  font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s,opacity .2s;
}
.btn:active{transform:scale(.98)}
.btn-primario{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn-primario:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed}
.btn-secundario{background:#e2e8f0;color:#334155}
.btn-wa{background:#25d366;color:#fff}

/* ---- barra superior del quiz ---- */
.quiz-top{
  display:flex;align-items:center;gap:16px;margin-bottom:16px;
  background:var(--card);border-radius:var(--radio);padding:14px 18px;box-shadow:var(--sombra);
}
.progreso{flex:1}
#contador-preguntas{font-weight:700;font-size:.9rem;color:#334155}
.barra{height:8px;background:#e2e8f0;border-radius:99px;margin-top:8px;overflow:hidden}
.barra-fill{height:100%;width:0;background:linear-gradient(90deg,var(--azul),var(--morado));transition:width .3s}

/* ---- cronómetro ---- */
.cronometro{position:relative;width:58px;height:58px;flex:none}
.crono-svg{width:100%;height:100%;transform:rotate(-90deg)}
.crono-bg{fill:none;stroke:#e2e8f0;stroke-width:3}
.crono-arco{fill:none;stroke:var(--azul);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
#crono-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.1rem;color:#334155}
.cronometro.alerta .crono-arco{stroke:var(--rojo)}
.cronometro.alerta #crono-num{color:var(--rojo)}
.cronometro.alerta{animation:latido .6s infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---- pregunta ---- */
.pregunta-card{text-align:center}
.etiqueta-tema{
  display:inline-block;background:#eff6ff;color:var(--azul-osc);
  border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:700;margin-bottom:14px;
}
.img-pregunta{
  width:100%;max-width:360px;height:auto;border-radius:14px;margin:0 auto 18px;
  display:block;box-shadow:0 4px 14px rgba(2,6,23,.08);background:#f8fafc;
}
#texto-pregunta{font-size:1.2rem;margin-bottom:20px;color:#0f172a;line-height:1.35}
.opciones{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.opcion{
  text-align:left;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;
  background:#fff;cursor:pointer;font-size:1rem;transition:all .15s;display:flex;gap:10px;align-items:center;
}
.opcion:hover{border-color:var(--azul);background:#f8fafc}
.opcion .letra{
  width:28px;height:28px;flex:none;border-radius:50%;background:#e2e8f0;color:#475569;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;
}
.opcion.sel{border-color:var(--azul);background:#eff6ff}
.opcion.sel .letra{background:var(--azul);color:#fff}
.opcion.correcta{border-color:var(--verde);background:#f0fdf4}
.opcion.correcta .letra{background:var(--verde);color:#fff}
.opcion.incorrecta{border-color:var(--rojo);background:#fef2f2}
.opcion.incorrecta .letra{background:var(--rojo);color:#fff}
.opcion.bloqueada{pointer-events:none}

/* ---- resultado ---- */
.veredicto-badge{
  width:110px;height:110px;border-radius:50%;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff;
}
.veredicto-badge.ok{background:var(--verde);box-shadow:0 10px 24px rgba(22,163,74,.4)}
.veredicto-badge.no{background:var(--rojo);box-shadow:0 10px 24px rgba(220,38,38,.4)}
.resultado-detalle{color:var(--gris);font-size:1.05rem;margin:6px 0 18px;font-weight:600}
.certificado-canvas{
  width:100%;height:auto;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:18px;
}
.acciones{display:flex;flex-direction:column;gap:12px}
.estado-envios{margin-top:14px;font-size:.85rem;color:var(--gris);white-space:pre-line}

@media(min-width:560px){
  .acciones{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .acciones .btn{flex:1;min-width:180px}
}

</style>
</head>
<body>
<div class="app">

  <section id="pantalla-inicio" class="pantalla activa">
    <div class="card">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
  <circle cx="100" cy="100" r="92" fill="url(#g)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="4" opacity="0.6"/>
  <path d="M100 44 C70 84 58 104 58 122 a42 42 0 0 0 84 0 c0 -18 -12 -38 -42 -78 z" fill="#fff" opacity="0.95"/>
  <path d="M80 120 a20 20 0 0 0 20 20" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 104 l10 10 l22 -24" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
      <h1 id="titulo-materia">Examen de Inocuidad Alimentaria</h1>
      <p class="subtitulo" id="subtitulo-inst">Reto Inocuidad HF</p>
      <div class="info-examen" id="info-examen"></div>
      <form id="form-inicio" novalidate>
        <label>Nombre completo *
          <input type="text" id="nombre" placeholder="Ej: Ana María Pérez" required />
        </label>
        <label>Documento / N.º de lista *
          <input type="text" id="documento" placeholder="Ej: 1003456789" required />
        </label>
        <label>Grado / Curso / Cargo
          <input type="text" id="grado" placeholder="Ej: 10-B o Manipulador" />
        </label>
        <p class="error" id="error-inicio"></p>
        <button type="submit" class="btn btn-primario">Comenzar examen ▶</button>
      </form>
    </div>
  </section>

  <section id="pantalla-quiz" class="pantalla">
    <header class="quiz-top">
      <div class="progreso">
        <span id="contador-preguntas">Pregunta 1 de 20</span>
        <div class="barra"><div id="barra-progreso" class="barra-fill"></div></div>
      </div>
      <div id="cronometro" class="cronometro">
        <svg viewBox="0 0 36 36" class="crono-svg">
          <path class="crono-bg" d="M18 2a16 16 0 1 1 0 32 16 16 0 0 1 0-32"/>
          <path id="crono-arco" class="crono-arco" d="M18 2a16 16 0 1 1 0 32 16 16 0 0 1 0-32"/>
        </svg>
        <span id="crono-num">25</span>
      </div>
    </header>
    <div class="card pregunta-card">
      <span id="etiqueta-tema" class="etiqueta-tema">Tema</span>
      <img id="img-pregunta" class="img-pregunta" alt="Ilustración de la pregunta" />
      <h2 id="texto-pregunta">Pregunta…</h2>
      <div id="opciones" class="opciones"></div>
      <button id="btn-siguiente" class="btn btn-primario" disabled>Siguiente ▶</button>
    </div>
  </section>

  <section id="pantalla-resultado" class="pantalla">
    <div class="card">
      <div id="veredicto-badge" class="veredicto-badge"></div>
      <h1 id="resultado-titulo"></h1>
      <p id="resultado-detalle" class="resultado-detalle"></p>
      <canvas id="certificado" width="1000" height="700" class="certificado-canvas"></canvas>
      <div class="acciones">
        <button id="btn-descargar" class="btn btn-primario">⬇ Descargar certificado</button>
        <button id="btn-whatsapp" class="btn btn-wa">Enviar resultado por WhatsApp</button>
        <button id="btn-reiniciar" class="btn btn-secundario">Realizar otro intento</button>
      </div>
      <p id="estado-envios" class="estado-envios"></p>
    </div>
  </section>

</div>
<script>

const APP_CONFIG = {
  institucion: "Reto Inocuidad HF",
  materia: "Inocuidad Alimentaria",
  docente: "Yesid Castrillón",
  totalPreguntas: 20,
  segundosPorPregunta: 25,
  alertaSonoraDesde: 5,
  umbralAprobacion: 80,
  email: {
    habilitado: true,
    correoDocente: "yesid.castrillon@gmail.com",
    serviceId: "TU_SERVICE_ID",
    templateId: "TU_TEMPLATE_ID",
    publicKey: "TU_PUBLIC_KEY",
  },
  whatsapp: {
    habilitado: true,
    numero: "573163165911",
    callMeBotApiKey: "",
    abrirRespaldoSiFalla: true,
  },
};

/* ============================================================================
 * BANCO DE PREGUNTAS  —  INOCUIDAD ALIMENTARIA  (Reto Inocuidad HF)
 * 13 temas, 5 niveles de dificultad (1=fácil ... 5=difícil), 39 preguntas.
 * En cada intento se eligen 20 garantizando cobertura de todos los temas.
 *
 * Estructura de cada pregunta:
 *   tema      : clave del tema (define la imagen ilustrativa)
 *   nivel     : 1 a 5
 *   pregunta  : enunciado
 *   opciones  : arreglo de respuestas
 *   correcta  : índice (0-based) de la opción correcta
 * ==========================================================================*/

const TEMAS = {
  bpm:                  { nombre: "Buenas Prácticas de Manufactura (BPM)", color: "#2563eb" },
  practicas_higienicas: { nombre: "Prácticas Higiénicas",                  color: "#0891b2" },
  educacion_sanitaria:  { nombre: "Educación Sanitaria",                   color: "#7c3aed" },
  haccp:                { nombre: "HACCP",                                 color: "#ea580c" },
  limpieza:             { nombre: "Limpieza y Desinfección",               color: "#0d9488" },
  cadena_frio:          { nombre: "Cadena de Frío",                        color: "#0284c7" },
  contaminacion_cruzada:{ nombre: "Contaminación Cruzada",                 color: "#dc2626" },
  plagas:               { nombre: "Manejo de Plagas",                      color: "#65a30d" },
  higiene_personal:     { nombre: "Higiene del Personal",                  color: "#db2777" },
  trazabilidad:         { nombre: "Trazabilidad",                          color: "#9333ea" },
  agua:                 { nombre: "Agua Potable",                          color: "#0ea5e9" },
  residuos:             { nombre: "Manejo de Residuos Sólidos",            color: "#16a34a" },
  eta:                  { nombre: "Enfermedades Transmitidas por Alimentos (ETA)", color: "#b91c1c" },
};

const PREGUNTAS = [
  /* ------------------------------- BPM ---------------------------------- */
  { tema:"bpm", nivel:1, pregunta:"¿Qué significan las siglas BPM en inocuidad alimentaria?",
    opciones:["Buenas Prácticas de Manufactura","Bases Para Manipular","Buen Proceso Microbiológico","Balance de Productos y Materiales"], correcta:0 },
  { tema:"bpm", nivel:3, pregunta:"¿Cuál es el principal objetivo de las BPM?",
    opciones:["Aumentar la producción al máximo","Garantizar alimentos inocuos y aptos para el consumo","Reducir el precio de los alimentos","Decorar la presentación del producto"], correcta:1 },
  { tema:"bpm", nivel:5, pregunta:"Dentro de las BPM, ¿qué condición debe cumplir el diseño de las instalaciones de procesamiento?",
    opciones:["Permitir el flujo del proceso evitando contaminación cruzada","Tener la mayor cantidad de equipos posible","Estar pintadas de colores oscuros","Ubicarse cerca de zonas de basura"], correcta:0 },

  /* -------------------------- PRÁCTICAS HIGIÉNICAS ---------------------- */
  { tema:"practicas_higienicas", nivel:1, pregunta:"¿Cuándo debe lavarse las manos un manipulador de alimentos?",
    opciones:["Solo al iniciar la jornada","Antes de manipular alimentos y después de ir al baño","Únicamente cuando se ven sucias","Una vez al día"], correcta:1 },
  { tema:"practicas_higienicas", nivel:2, pregunta:"¿Cuánto tiempo, como mínimo, debe durar un correcto lavado de manos?",
    opciones:["2 segundos","5 segundos","20 segundos","No importa el tiempo"], correcta:2 },
  { tema:"practicas_higienicas", nivel:4, pregunta:"¿Cuál de las siguientes es una práctica higiénica INCORRECTA al manipular alimentos?",
    opciones:["Usar tapabocas y cofia","Probar la comida con el mismo utensilio que se sirve","Lavarse las manos al cambiar de tarea","Mantener las uñas cortas y limpias"], correcta:1 },

  /* -------------------------- EDUCACIÓN SANITARIA ----------------------- */
  { tema:"educacion_sanitaria", nivel:1, pregunta:"¿Para qué sirve la educación sanitaria del personal?",
    opciones:["Para que conozcan y apliquen prácticas seguras de manipulación","Para aumentar su salario","Para decorar el establecimiento","Para vender más rápido"], correcta:0 },
  { tema:"educacion_sanitaria", nivel:3, pregunta:"¿Cada cuánto se recomienda capacitar al personal manipulador de alimentos?",
    opciones:["Nunca, basta con contratarlos","De forma periódica y continua","Solo si ocurre un brote","Cada 10 años"], correcta:1 },
  { tema:"educacion_sanitaria", nivel:5, pregunta:"¿Qué documento respalda que un manipulador recibió formación en inocuidad?",
    opciones:["La factura de compra","El certificado o constancia de capacitación","El recibo de servicios","El menú del día"], correcta:1 },

  /* ------------------------------- HACCP -------------------------------- */
  { tema:"haccp", nivel:2, pregunta:"¿Qué evalúa principalmente el sistema HACCP?",
    opciones:["El sabor de los alimentos","Los peligros y puntos críticos de control en el proceso","El color del empaque","El costo de producción"], correcta:1 },
  { tema:"haccp", nivel:4, pregunta:"¿Qué es un Punto Crítico de Control (PCC)?",
    opciones:["Un punto donde se puede aplicar control para prevenir o eliminar un peligro","El lugar donde se almacena el dinero","La entrada principal de la fábrica","El punto de venta al cliente"], correcta:0 },
  { tema:"haccp", nivel:5, pregunta:"¿Cuál es el primer principio del sistema HACCP?",
    opciones:["Establecer límites críticos","Realizar un análisis de peligros","Llevar registros","Verificar el sistema"], correcta:1 },

  /* ----------------------- LIMPIEZA Y DESINFECCIÓN ---------------------- */
  { tema:"limpieza", nivel:1, pregunta:"¿Cuál es la diferencia entre limpiar y desinfectar?",
    opciones:["Son exactamente lo mismo","Limpiar elimina suciedad visible; desinfectar reduce los microorganismos","Desinfectar solo aplica al piso","Limpiar mata todos los virus"], correcta:1 },
  { tema:"limpieza", nivel:3, pregunta:"¿Cuál es el orden correcto de un procedimiento de limpieza y desinfección?",
    opciones:["Desinfectar y luego limpiar","Limpiar, enjuagar, desinfectar y secar","Solo enjuagar con agua","Aplicar desinfectante sobre la suciedad"], correcta:1 },
  { tema:"limpieza", nivel:4, pregunta:"¿Qué producto se usa comúnmente para desinfectar superficies en contacto con alimentos?",
    opciones:["Aceite de cocina","Solución de hipoclorito de sodio en concentración adecuada","Detergente para ropa","Agua hirviendo solamente"], correcta:1 },

  /* --------------------------- CADENA DE FRÍO --------------------------- */
  { tema:"cadena_frio", nivel:1, pregunta:"¿Para qué sirve la cadena de frío?",
    opciones:["Para congelar siempre todos los alimentos","Para mantener los alimentos a temperaturas seguras y frenar el crecimiento microbiano","Para enfriar la cocina","Para ahorrar energía"], correcta:1 },
  { tema:"cadena_frio", nivel:3, pregunta:"¿A qué temperatura debe mantenerse normalmente la refrigeración de alimentos?",
    opciones:["Entre 0 °C y 4 °C","Entre 10 °C y 15 °C","Entre 20 °C y 25 °C","Por encima de 30 °C"], correcta:0 },
  { tema:"cadena_frio", nivel:5, pregunta:"La 'zona de peligro' de temperatura, donde las bacterias se multiplican rápidamente, está aproximadamente entre:",
    opciones:["−18 °C y 0 °C","5 °C y 60 °C","60 °C y 100 °C","100 °C y 150 °C"], correcta:1 },

  /* ----------------------- CONTAMINACIÓN CRUZADA ------------------------ */
  { tema:"contaminacion_cruzada", nivel:1, pregunta:"¿Qué es la contaminación cruzada?",
    opciones:["El paso de contaminantes de un alimento o superficie a otro","Cocinar dos alimentos a la vez","Mezclar dos sabores","Lavar los platos con agua fría"], correcta:0 },
  { tema:"contaminacion_cruzada", nivel:3, pregunta:"¿Cuál es una buena práctica para evitar la contaminación cruzada?",
    opciones:["Usar la misma tabla para carne cruda y verduras listas para comer","Separar alimentos crudos de los cocidos y usar tablas de distinto color","Guardar la carne cruda encima de los alimentos cocidos","Reutilizar el cuchillo sin lavarlo"], correcta:1 },
  { tema:"contaminacion_cruzada", nivel:5, pregunta:"En un refrigerador, ¿dónde deben colocarse las carnes crudas para evitar contaminación cruzada?",
    opciones:["En los estantes superiores","En la parte inferior, debajo de los alimentos listos para consumir","Junto a las frutas","En la puerta"], correcta:1 },

  /* --------------------------- MANEJO DE PLAGAS ------------------------- */
  { tema:"plagas", nivel:1, pregunta:"¿Cuáles son ejemplos de plagas en un establecimiento de alimentos?",
    opciones:["Roedores, insectos y aves","Clientes y proveedores","Empleados","Productos vencidos"], correcta:0 },
  { tema:"plagas", nivel:3, pregunta:"¿Cuál es la mejor estrategia para el manejo de plagas?",
    opciones:["Aplicar veneno constantemente sobre los alimentos","La prevención: evitar el ingreso y eliminar refugios y alimento","Ignorarlas si son pocas","Dejar puertas abiertas para que salgan"], correcta:1 },
  { tema:"plagas", nivel:4, pregunta:"¿Dónde NO deben aplicarse plaguicidas en una planta de alimentos?",
    opciones:["Directamente sobre alimentos o superficies de contacto","En el exterior del edificio","En desagües según el plan","En zonas controladas y señalizadas"], correcta:0 },

  /* -------------------------- HIGIENE DEL PERSONAL ---------------------- */
  { tema:"higiene_personal", nivel:1, pregunta:"¿Qué debe hacer un manipulador con su cabello durante la jornada?",
    opciones:["Dejarlo suelto","Mantenerlo recogido y cubierto con cofia o malla","Peinarlo sobre los alimentos","No importa"], correcta:1 },
  { tema:"higiene_personal", nivel:2, pregunta:"¿Qué debe hacer un manipulador de alimentos que está enfermo con gripa o diarrea?",
    opciones:["Seguir trabajando normalmente","Informar a su supervisor y abstenerse de manipular alimentos","Usar más perfume","Trabajar con guantes y ya"], correcta:1 },
  { tema:"higiene_personal", nivel:4, pregunta:"¿Cuál de los siguientes está PROHIBIDO al manipular alimentos por higiene personal?",
    opciones:["Usar uniforme limpio","Usar anillos, relojes y joyas","Lavarse las manos","Usar tapabocas"], correcta:1 },

  /* ----------------------------- TRAZABILIDAD --------------------------- */
  { tema:"trazabilidad", nivel:2, pregunta:"¿Qué permite la trazabilidad de un alimento?",
    opciones:["Seguir su recorrido desde el origen hasta el consumidor","Hacerlo más sabroso","Reducir su peso","Cambiar su color"], correcta:0 },
  { tema:"trazabilidad", nivel:4, pregunta:"¿Por qué es importante la trazabilidad ante un problema de inocuidad?",
    opciones:["Para subir los precios","Para identificar y retirar rápidamente los lotes afectados","Para premiar a los empleados","No tiene importancia"], correcta:1 },
  { tema:"trazabilidad", nivel:5, pregunta:"¿Qué información suele registrarse para garantizar la trazabilidad?",
    opciones:["Solo el nombre del producto","Lote, fecha, proveedor y destino del producto","El gusto del cliente","El clima del día"], correcta:1 },

  /* ------------------------------ AGUA POTABLE -------------------------- */
  { tema:"agua", nivel:1, pregunta:"¿Qué es el agua potable?",
    opciones:["Agua apta para el consumo humano, libre de contaminantes","Agua de cualquier río","Agua con jabón","Agua hervida una sola vez al año"], correcta:0 },
  { tema:"agua", nivel:3, pregunta:"¿Por qué el agua usada en la producción de alimentos debe ser potable?",
    opciones:["Para que el alimento sepa mejor","Porque el agua contaminada puede transmitir enfermedades a los alimentos","Para gastar más agua","Porque es más barata"], correcta:1 },
  { tema:"agua", nivel:5, pregunta:"¿Qué sustancia se usa comúnmente para desinfectar el agua de consumo?",

  /* ----------------------- MANEJO DE RESIDUOS SÓLIDOS ------------------- */

/* ============================================================================
 *  LÓGICA DE LA APLICACIÓN
 * ==========================================================================*/
"use strict";

/* ---------- Estado global ---------- */
const estado = {
  estudiante: { nombre: "", documento: "", grado: "" },
  preguntas: [],         // las 20 seleccionadas para este intento
  indice: 0,
  respuestas: [],        // {tema, correcta:bool}
  correctas: 0,
  bloqueado: false,
  inicio: null,
};

let timer = null;
let segundos = 0;
let audioCtx = null;

/* ---------- Utilidades de pantalla ---------- */
const $ = (id) => document.getElementById(id);
function mostrarPantalla(id) {
  document.querySelectorAll(".pantalla").forEach((p) => p.classList.remove("activa"));
  $(id).classList.add("activa");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================================
 *  INICIO
 * ==========================================================================*/
function initInicio() {
  $("titulo-materia").textContent = "Examen de " + APP_CONFIG.materia;
  $("subtitulo-inst").textContent = APP_CONFIG.institucion;
  $("info-examen").innerHTML = `
    <span>📚 ${Object.keys(TEMAS).length} temas</span>
    <span>📝 ${APP_CONFIG.totalPreguntas} preguntas</span>
    <span>⏱ ${APP_CONFIG.segundosPorPregunta}s por pregunta</span>
    <span>🎯 Aprueba con ≥ ${APP_CONFIG.umbralAprobacion}%</span>`;

  $("form-inicio").addEventListener("submit", (e) => {
    e.preventDefault();
    const nombre = $("nombre").value.trim();
    const documento = $("documento").value.trim();
    const grado = $("grado").value.trim();
    if (nombre.length < 3 || documento.length < 1) {
      $("error-inicio").textContent = "Por favor escribe tu nombre completo y documento.";
      return;
    }
    estado.estudiante = { nombre, documento, grado };
    comenzarExamen();
  });
}

/* ============================================================================
 *  SELECCIÓN DE PREGUNTAS  (20 cubriendo los 7 temas y variando dificultad)
 * ==========================================================================*/
function barajar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function seleccionarPreguntas() {
  const total = Math.min(APP_CONFIG.totalPreguntas, PREGUNTAS.length);
  const porTema = {};
  PREGUNTAS.forEach((p) => {
    (porTema[p.tema] = porTema[p.tema] || []).push(p);
  });

  const seleccion = [];
  // 1) Garantizar al menos una pregunta de cada tema.
  Object.keys(porTema).forEach((t) => {
    const baraja = barajar(porTema[t]);
    seleccion.push(baraja[0]);
  });
  // 2) Completar hasta "total" con el resto, evitando repetir.
  const restantes = barajar(PREGUNTAS.filter((p) => !seleccion.includes(p)));
  for (const p of restantes) {
    if (seleccion.length >= total) break;
    seleccion.push(p);
  }
  // 3) Ordenar por nivel de dificultad ascendente (fácil -> difícil).
  return barajar(seleccion).slice(0, total).sort((a, b) => a.nivel - b.nivel);
}

/* ============================================================================
 *  EXAMEN
 * ==========================================================================*/
function comenzarExamen() {
  estado.preguntas = seleccionarPreguntas();
  estado.indice = 0;
  estado.respuestas = [];
  estado.correctas = 0;
  estado.inicio = new Date();
  mostrarPantalla("pantalla-quiz");
  renderPregunta();
}

function renderPregunta() {
  estado.bloqueado = false;
  const p = estado.preguntas[estado.indice];
  const tema = TEMAS[p.tema];

  $("contador-preguntas").textContent =
    `Pregunta ${estado.indice + 1} de ${estado.preguntas.length}`;
  $("barra-progreso").style.width =
    `${(estado.indice / estado.preguntas.length) * 100}%`;

  const etiqueta = $("etiqueta-tema");
  etiqueta.textContent = `${tema.nombre}  ·  Nivel ${p.nivel}/5`;
  etiqueta.style.background = tema.color + "22";
  etiqueta.style.color = tema.color;

  const img = $("img-pregunta");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVGS[p.tema] || "");
  img.alt = tema.nombre;

  $("texto-pregunta").textContent = p.pregunta;

  const cont = $("opciones");
  cont.innerHTML = "";
  const letras = ["A", "B", "C", "D", "E"];
  p.opciones.forEach((op, i) => {
    const div = document.createElement("div");
    div.className = "opcion";
    div.innerHTML = `<span class="letra">${letras[i]}</span><span>${op}</span>`;
    div.addEventListener("click", () => seleccionarOpcion(i, div));
    cont.appendChild(div);
  });

  const btn = $("btn-siguiente");
  btn.disabled = true;
  btn.textContent =
    estado.indice === estado.preguntas.length - 1 ? "Finalizar ✔" : "Siguiente ▶";

  iniciarCronometro();
}

function seleccionarOpcion(i, div) {
  if (estado.bloqueado) return;
  document.querySelectorAll(".opcion").forEach((o) => o.classList.remove("sel"));
  div.classList.add("sel");
  div.dataset.elegida = i;
  $("btn-siguiente").disabled = false;
  $("opciones").dataset.elegida = i;
}

/* ---------- Confirmar respuesta y avanzar ---------- */
function confirmarRespuesta(expiroTiempo) {
  if (estado.bloqueado) return;
  estado.bloqueado = true;
  detenerCronometro();

  const p = estado.preguntas[estado.indice];
  const elegidaAttr = $("opciones").dataset.elegida;
  const elegida = elegidaAttr === undefined ? -1 : parseInt(elegidaAttr, 10);
  delete $("opciones").dataset.elegida;

  const opcionesDom = document.querySelectorAll(".opcion");
  opcionesDom.forEach((o, idx) => {
    o.classList.add("bloqueada");
    if (idx === p.correcta) o.classList.add("correcta");
    else if (idx === elegida) o.classList.add("incorrecta");
  });

  const acerto = elegida === p.correcta;
  if (acerto) estado.correctas++;
  estado.respuestas.push({ tema: p.tema, correcta: acerto, expiro: !!expiroTiempo });

  // pequeña pausa para que el estudiante vea la respuesta correcta
  setTimeout(() => {
    if (estado.indice < estado.preguntas.length - 1) {
      estado.indice++;
      renderPregunta();
    } else {
      finalizarExamen();
    }
  }, 1100);
}

/* ============================================================================
 *  CRONÓMETRO + SONIDO
 * ==========================================================================*/
function iniciarCronometro() {
  detenerCronometro();
  segundos = APP_CONFIG.segundosPorPregunta;
  const arco = $("crono-arco");
  const crono = $("cronometro");
  crono.classList.remove("alerta");
  arco.style.stroke = ""; // reset
  actualizarCronoUI();

  timer = setInterval(() => {
    segundos--;
    actualizarCronoUI();

    if (segundos <= APP_CONFIG.alertaSonoraDesde && segundos > 0) {
      crono.classList.add("alerta");
      beep(880, 0.12);            // pitido de alerta
    }
    if (segundos <= 0) {
      detenerCronometro();
      beepLargo();                // alarma final
      confirmarRespuesta(true);   // tiempo agotado -> se confirma lo que haya
    }
  }, 1000);
}

function actualizarCronoUI() {
  $("crono-num").textContent = segundos;
  const frac = segundos / APP_CONFIG.segundosPorPregunta;
  $("crono-arco").style.strokeDashoffset = String(100 - frac * 100);
}

function detenerCronometro() {
  if (timer) { clearInterval(timer); timer = null; }
}

/* ---------- Sonidos con Web Audio API (sin archivos) ---------- */
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur) {
  const ctx = getAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur + 0.02);
}
function beepLargo() {
  beep(440, 0.5);
  setTimeout(() => beep(330, 0.5), 200);
}

/* ============================================================================
 *  FINALIZAR + RESULTADO + CERTIFICADO
 * ==========================================================================*/
function finalizarExamen() {
  $("barra-progreso").style.width = "100%";
  const total = estado.preguntas.length;
  const porcentaje = Math.round((estado.correctas / total) * 100);
  const aprobado = porcentaje >= APP_CONFIG.umbralAprobacion;

  // Badge + textos
  const badge = $("veredicto-badge");
  badge.className = "veredicto-badge " + (aprobado ? "ok" : "no");
  badge.textContent = aprobado ? "✓" : "✕";
  $("resultado-titulo").textContent = aprobado ? "¡APROBADO!" : "NO APROBADO";
  $("resultado-titulo").style.color = aprobado ? "#16a34a" : "#dc2626";
  $("resultado-detalle").textContent =
    `${estado.estudiante.nombre} — ${estado.correctas} de ${total} correctas (${porcentaje}%)`;

  const resultado = {
    ...estado.estudiante,
    correctas: estado.correctas,
    total,
    porcentaje,
    veredicto: aprobado ? "APROBADO" : "NO APROBADO",
    fecha: new Date().toLocaleString("es-CO"),
  };

  mostrarPantalla("pantalla-resultado");
  dibujarCertificado(resultado);

  // Botones
  $("btn-descargar").onclick = descargarCertificado;
  $("btn-whatsapp").onclick = () => enviarWhatsApp(resultado, true);
  $("btn-reiniciar").onclick = () => location.reload();

  // 5 y 6: envíos automáticos (sin que el estudiante haga nada)
  enviarNotificaciones(resultado);
}

/* ---------- Certificado en Canvas (con logo real) ---------- */
function dibujarCertificado(r) {
  const canvas = $("certificado");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const aprobado = r.veredicto === "APROBADO";
  const colorPrincipal = aprobado ? "#16a34a" : "#dc2626";

  // Fondo
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  // Marco
  ctx.strokeStyle = colorPrincipal;
  ctx.lineWidth = 10;
  ctx.strokeRect(25, 25, W - 50, H - 50);
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 2;
  ctx.strokeRect(45, 45, W - 90, H - 90);

  const centro = W / 2;
  ctx.textAlign = "center";

  function texto(t, y, size, color, bold, font) {
    ctx.fillStyle = color;
    ctx.font = `${bold ? "bold " : ""}${size}px ${font || "Georgia, serif"}`;
    ctx.fillText(t, centro, y);
  }

  // Logo dibujado directamente en el canvas (sin archivos externos)
  dibujarLogoCert(ctx, centro, 125, 56);
  pintarTextos();

  function pintarTextos() {
    texto(APP_CONFIG.institucion.toUpperCase(), 215, 30, "#334155", true, "Arial");
    texto("CERTIFICADO DE CALIFICACIÓN", 265, 42, "#0f172a", true, "Georgia, serif");
    texto(APP_CONFIG.materia, 305, 26, "#64748b", false, "Arial");

    texto("Se certifica que", 365, 24, "#475569", false, "Arial");
    texto(r.nombre, 410, 44, "#1e40af", true, "Georgia, serif");
    texto(
      `Documento/Lista: ${r.documento}${r.grado ? "   ·   Grado: " + r.grado : ""}`,
      445, 22, "#64748b", false, "Arial"
    );

    texto(
      `obtuvo ${r.correctas} de ${r.total} respuestas correctas`,
      500, 26, "#334155", false, "Arial"
    );

    // Calificación grande
    texto(`${r.porcentaje}%`, 565, 60, colorPrincipal, true, "Arial");

    // Veredicto
    ctx.fillStyle = colorPrincipal;
    const bw = 360, bh = 64, bx = centro - bw / 2, by = 590;
    redondeado(ctx, bx, by, bw, bh, 14);
    ctx.fill();
    texto(r.veredicto, 633, 40, "#ffffff", true, "Arial");

    // Pie
    texto(`Fecha: ${r.fecha}`, 678, 18, "#94a3b8", false, "Arial");
  }
}
function redondeado(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function descargarCertificado() {
  const canvas = $("certificado");
  const link = document.createElement("a");
  const nombre = estado.estudiante.nombre.replace(/\s+/g, "_");
  link.download = `Certificado_${nombre}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

/* ============================================================================
 *  5 y 6: NOTIFICACIONES  (correo automático + WhatsApp)
 * ==========================================================================*/
function enviarNotificaciones(r) {
  const estados = [];
  // Correo automático al docente — sin acción del estudiante
  if (APP_CONFIG.email.habilitado) {
    enviarCorreo(r)
      .then(() => actualizarEstado("✅ Resultado enviado por correo al docente."))
      .catch((err) => actualizarEstado("⚠️ Correo no enviado (revisar config EmailJS): " + err));
  }
  // WhatsApp automático (si hay API) o respaldo
  if (APP_CONFIG.whatsapp.habilitado) {
    enviarWhatsApp(r, false);
  }
}

let _estadoTxt = "";
function actualizarEstado(linea) {
  _estadoTxt += (_estadoTxt ? "\n" : "") + linea;
  $("estado-envios").textContent = _estadoTxt;
}

function mensajeResultado(r) {
  return (
    `📋 *Resultado de Examen — ${APP_CONFIG.materia}*\n` +
    `Institución: ${APP_CONFIG.institucion}\n` +
    `Estudiante: ${r.nombre}\n` +
    `Documento/Lista: ${r.documento}\n` +
    (r.grado ? `Grado: ${r.grado}\n` : "") +
    `Calificación: ${r.correctas}/${r.total} (${r.porcentaje}%)\n` +
    `Resultado: ${r.veredicto}\n` +
    `Fecha: ${r.fecha}`
  );
}

/* ---------- Correo vía EmailJS ---------- */
function enviarCorreo(r) {
  return new Promise((resolve, reject) => {
    const cfg = APP_CONFIG.email;
    if (!window.emailjs) return reject("librería EmailJS no cargó");
    if (cfg.serviceId.startsWith("TU_") || cfg.publicKey.startsWith("TU_")) {
      return reject("faltan claves de EmailJS");
    }
    try {
      emailjs.init({ publicKey: cfg.publicKey });
      const params = {
        to_email: cfg.correoDocente,
        docente: APP_CONFIG.docente,
        materia: APP_CONFIG.materia,
        institucion: APP_CONFIG.institucion,
        estudiante: r.nombre,
        documento: r.documento,
        grado: r.grado || "—",
        correctas: r.correctas,
        total: r.total,
        porcentaje: r.porcentaje,
        veredicto: r.veredicto,
        fecha: r.fecha,
        mensaje: mensajeResultado(r),
      };
      emailjs.send(cfg.serviceId, cfg.templateId, params)
        .then(() => resolve(), (e) => reject((e && e.text) || "error de envío"));
    } catch (e) {
      reject(e.message || "error inesperado");
    }
  });
}

/* ---------- WhatsApp ---------- */
function enviarWhatsApp(r, forzarApertura) {
  const cfg = APP_CONFIG.whatsapp;
  const texto = mensajeResultado(r);

  // Modo automático con CallMeBot (si hay apikey)
  if (cfg.callMeBotApiKey && !forzarApertura) {
    const url =
      `https://api.callmebot.com/whatsapp.php?phone=${cfg.numero}` +
      `&text=${encodeURIComponent(texto)}&apikey=${cfg.callMeBotApiKey}`;
    fetch(url, { mode: "no-cors" })
      .then(() => actualizarEstado("✅ Resultado enviado por WhatsApp (automático)."))
      .catch(() => {
        actualizarEstado("⚠️ WhatsApp automático falló; usa el botón verde.");
      });
    return;
  }

  // Respaldo: abrir WhatsApp con el mensaje listo (1 clic del usuario)
  if (forzarApertura || cfg.abrirRespaldoSiFalla) {
    const wa = `https://wa.me/${cfg.numero}?text=${encodeURIComponent(texto)}`;
    if (forzarApertura) {
      window.open(wa, "_blank");
    } else {
      actualizarEstado("ℹ️ Para WhatsApp automático configura una API; mientras tanto usa el botón verde.");
    }
  }
}


/* ---------- Logo vectorial para el certificado ---------- */
function dibujarLogoCert(ctx, cx, cy, r) {
  const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, "#16a34a"); g.addColorStop(1, "#0891b2");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#16a34a"; ctx.lineWidth = r * 0.16; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.28, cy + r * 0.02);
  ctx.lineTo(cx - r * 0.05, cy + r * 0.26);
  ctx.lineTo(cx + r * 0.34, cy - r * 0.28);
  ctx.stroke();
}
